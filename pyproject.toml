[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aims-fd"
dynamic = ["version"]
description = "Finite-difference forces and stress for FHI-aims"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shuo Zhao" }]
keywords = ["FHI-aims", "DFT", "finite differences", "forces", "stress"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy", "pyfhiaims>=1.2,<1.3"]

[project.urls]
Homepage = "https://github.com/Surefire618/aims-fd"
Issues = "https://github.com/Surefire618/aims-fd/issues"

[project.optional-dependencies]
tests = ["pytest>=6.0", "ase>=3.23"]

[project.scripts]
aims-fd = "aims_fd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "aims_fd.version.__version__" }

[tool.setuptools.package-data]
aims_fd = ["templates/*.template"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "W", "I", "B", "UP", "SIM"]
